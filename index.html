<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GURED - India Emergency Help</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fce8e6; text-align: center; padding: 15px; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); max-width: 450px; margin: 20px auto; border-top: 10px solid #d32f2f; }
        h2 { color: #d32f2f; margin-bottom: 5px; }
        p.subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        .btn { width: 100%; padding: 18px; margin-top: 12px; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-upload { background-color: #5a67d8; color: white; }
        .btn-loc { background-color: #e53e3e; color: white; }
        .btn-wa { background-color: #2f855a; color: white; display: none; }
        #preview { width: 100%; border-radius: 12px; margin-top: 15px; display: none; border: 3px solid #eee; }
        select { width: 100%; padding: 15px; border-radius: 10px; margin-top: 10px; font-size: 16px; border: 2px solid #d32f2f; background: #fff; }
        label { font-weight: bold; display: block; margin-top: 20px; text-align: left; color: #444; }
        #status { color: #c53030; font-weight: bold; margin-top: 10px; min-height: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚨 GURED Reporter</h2>
    <p class="subtitle">Emergency Assistance | అత్యవసర సహాయం</p>
    
    <input type="file" accept="image/*" capture="camera" id="incidentPhoto" onchange="previewImage()" style="display: none;">
    <button class="btn btn-upload" onclick="document.getElementById('incidentPhoto').click()">📸 Take Photo / ఫోటో తీయండి</button>
    <img id="preview" src="">

    <label>📍 Select State/District (రాష్ట్రం/జిల్లా):</label>
    <select id="emergencyNumber">
        <optgroup label="🚨 National (India)">
            <option value="112">National Emergency (112) - Free</option>
            <option value="108">Ambulance (108)</option>
            <option value="100">Police (100)</option>
        </optgroup>
        <optgroup label="☀️ Andhra Pradesh">
            <option value="918518220001">Kurnool (కర్నూలు)</option>
            <option value="918514220001">Nandyal (నంద్యాల)</option>
            <option value="918662571234">Vijayawada (విజయవాడ)</option>
            <option value="918912564321">Visakhapatnam (విశాఖ)</option>
        </optgroup>
        <optgroup label="💎 Telangana">
            <option value="914023451234">Hyderabad (హైదరాబాద్)</option>
            <option value="918702451234">Warangal (వరంగల్)</option>
        </optgroup>
        <optgroup label="🇮🇳 Other States">
            <option value="112">Karnataka / Tamil Nadu / Others</option>
        </optgroup>
    </select>

    <button class="btn btn-loc" id="locBtn" onclick="getFastLocation()">📍 Fix Location / లొకేషన్ పట్టుకో</button>
    <p id="status"></p>

    <button class="btn btn-wa" id="waBtn" onclick="sendEmergencyAlert()">📲 Send Alert / అలర్ట్ పంపు</button>
</div>

<script>
    let finalMapLink = "";

    function previewImage() {
        const file = document.getElementById('incidentPhoto').files[0];
        const preview = document.getElementById('preview');
        const reader = new FileReader();
        reader.onloadend = () => { preview.src = reader.result; preview.style.display = "block"; }
        if (file) reader.readAsDataURL(file);
    }

    function getFastLocation() {
        let status = document.getElementById("status");
        if (navigator.geolocation) {
            status.innerHTML = "⏳ Finding Location... వెతుకుతున్నాము...";
            navigator.geolocation.getCurrentPosition((pos) => {
                finalMapLink = "https://www.google.com/maps?q=" + pos.coords.latitude + "," + pos.coords.longitude;
                status.innerHTML = "✅ Location Found! లొకేషన్ దొరికింది!";
                document.getElementById("locBtn").style.display = "none";
                document.getElementById("waBtn").style.display = "block";
            }, (err) => {
                status.innerHTML = "❌ Please enable GPS / GPS ఆన్ చేయండి.";
            }, { enableHighAccuracy: true, timeout: 5000 });
        }
    }

    function sendEmergencyAlert() {
        let message = "🚨 *GURED EMERGENCY ALERT*\n\n📍 Location: " + finalMapLink + "\n\nSent via GURED App";
        let target = document.getElementById("emergencyNumber").value;

        if (navigator.onLine) {
            // Online: WhatsApp
            window.open("https://wa.me/" + target + "?text=" + encodeURIComponent(message), '_blank');
        } else {
            // Offline/No Balance: SMS
            window.location.href = "sms:" + target + "?body=" + encodeURIComponent(message);
        }
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    }
</script>
</body>
    </html>
