<button onclick="sendEmergencyWhatsApp()" style="background-color: #25D366; color: white; font-weight: bold;">
    Direct WhatsApp Alert (అత్యవసర సహాయం)
</button>

<script>
function sendEmergencyWhatsApp() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;
            var message = "అత్యవసర సహాయం కావాలి! ప్రమాదం జరిగిన లొకేషన్: https://www.google.com/maps?q=" + lat + "," + lon;
            
            // ఇక్కడ 108 లేదా ఎమర్జెన్సీ నంబర్ ఇవ్వవచ్చు
            var whatsappUrl = "https://wa.me/91XXXXXXXXXX?text=" + encodeURIComponent(message);
            window.open(whatsappUrl, '_blank');
        });
    } else {
        alert("లొకేషన్ పర్మిషన్ ఇవ్వండి.");
    }
}
</script>
