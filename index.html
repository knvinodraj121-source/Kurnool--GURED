<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GURED - ఎమర్జెన్సీ హెల్ప్</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8d7da; text-align: center; padding: 15px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); max-width: 400px; margin: auto; border-top: 8px solid #d32f2f; }
        h2 { color: #d32f2f; margin-bottom: 5px; }
        .step { background: #fff5f5; padding: 10px; border-radius: 10px; margin: 10px 0; border: 1px solid #feb2b2; }
        #preview { width: 100%; border-radius: 10px; margin-top: 10px; display: none; }
        .btn { width: 100%; padding: 18px; margin-top: 10px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-upload { background-color: #4a5568; color: white; }
        .btn-loc { background-color: #e53e3e; color: white; }
        .btn-wa { background-color: #38a169; color: white; display: none; }
        #status { color: #c53030; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚨 GURED రిపోర్టర్</h2>
    <p>యాక్సిడెంట్ జరిగితే వెంటనే రిపోర్ట్ చేయండి</p>

    <div class="step">
        <label><b>1. ఘటన ఫోటో తీయండి:</b></label>
        <input type="file" accept="image/*" capture="camera" id="incidentPhoto" onchange="previewImage()" style="display: none;">
        <button class="btn btn-upload" onclick="document.getElementById('incidentPhoto').click()">📸 కెమెరా ఓపెన్ చేయి</button>
        <img id="preview" src="" alt="ప్రివ్యూ">
    </div>

    <button class="btn btn-loc" id="locBtn" onclick="getFastLocation()">2. లొకేషన్ ఫిక్స్ చేయి</button>
    <p id="status"></p>

    <button class="btn btn-wa" id="waBtn" onclick="sendEmergencyAlert()">3. వాట్సాప్ అలర్ట్ పంపు</button>
</div>

<script>
    let finalMapLink = "";

    // ఫోటో ప్రివ్యూ చూపించడానికి
    function previewImage() {
        const file = document.getElementById('incidentPhoto').files[0];
        const preview = document.getElementById('preview');
        const reader = new FileReader();
        reader.onloadend = function() {
            preview.src = reader.result;
            preview.style.display = "block";
        }
        if (file) { reader.readAsDataURL(file); }
    }

    // లొకేషన్ కనుక్కోవడానికి
// లొకేషన్ ఖచ్చితంగా కనుక్కోవడానికి
function getFastLocation() {
    let status = document.getElementById("status");
    if (navigator.geolocation) {
        status.innerHTML = "⏳ వెతుకుతున్నాము (High Accuracy)...";
        
        navigator.geolocation.getCurrentPosition(function(position) {
            let lat = position.coords.latitude;
            let lon = position.coords.longitude;
            // ఖచ్చితమైన మ్యాప్ లింక్
            finalMapLink = "https://www.google.com/maps?q=" + lat + "," + lon;
        }
            status.innerHTML = "✅ లొకేషన్ దొరికింది!";
            status.style.color = "#2f855a";
            document.getElementById("locBtn").style.display = "none";
            document.getElementById("waBtn").style.display = "block";
        }, function(error) {
            status.innerHTML = "❌ లొకేషన్ దొరకలేదు. దయచేసి GPS ఆన్ చేయండి.";
        }, {
            enableHighAccuracy: true,  // ఇది ఖచ్చితమైన లొకేషన్ ఇస్తుంది
            timeout: 10000,            // 10 సెకన్ల వరకు వెతుకుతుంది
            maximumAge: 0              // పాత లొకేషన్ డేటాను వాడదు
        });
    }
            }
                                                 
    function sendEmergencyAlert() {
    let message = "🚨 *అత్యవసర రిపోర్ట్ (GURED)*\n\n📍 *లొకేషన్:* " + finalMapLink + "\n📸 *గమనిక:* ఫోటో తీశాను, అటాచ్ చేస్తున్నాను.";
                    
</script>

</body>
</html>
